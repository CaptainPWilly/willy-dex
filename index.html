.trading-card{width:100%;height:100%;position:relative;overflow:hidden;border:5px ridge #c79b58;border-radius:14px;background:radial-gradient(ellipse at 50% 25%,#513921,#17151b 72%);box-shadow:inset 0 0 0 3px #3e2815,0 12px 30px #0009;padding:clamp(9px,2.5%,17px);display:flex;flex-direction:column;gap:2%;color:#f8e6be;text-align:center}.trading-card:after{content:"";position:absolute;inset:7px;border:1px solid #c69a59aa;border-radius:8px;pointer-events:none}.tc-top{height:15%;display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid #b6884f;padding:0 2px}.tc-title{font-size:clamp(10px,2.5vw,18px);font-weight:bold;letter-spacing:.03em;text-align:left;line-height:1.1;overflow-wrap:anywhere}.tc-number{font-size:clamp(8px,1.7vw,12px);color:#e9c68b;white-space:nowrap}.tc-art{height:49%;min-height:0;display:grid;place-items:center;overflow:hidden;border:2px solid #bc8b4d;border-radius:4px;background:radial-gradient(#654e32,#211a1b 76%);position:relative}.tc-art img{display:block;width:100%;height:100%;object-fit:contain;filter:none}.tc-art .missing{font-size:clamp(9px,2vw,14px);letter-spacing:.1em;color:#bba17c}.tc-role{font-size:clamp(9px,2vw,15px);font-weight:bold;letter-spacing:.04em;min-height:12%;display:grid;place-items:center;border-block:1px solid #866239;padding:3px;overflow-wrap:anywhere}.tc-lore{min-height:0;flex:1;display:grid;place-items:center;color:#d6b990;font-size:clamp(8px,1.8vw,12px);line-height:1.25;padding:2px 3px}.tc-bottom{display:flex;justify-content:space-between;gap:5px;border-top:1px solid #b6884f;padding-top:6px;font-size:clamp(9px,1.8vw,13px);font-weight:bold}.tc-date{color:#d7af7a;text-align:right;font-size:clamp(7px,1.5vw,11px)}.overlay .trading-card{width:min(90vw,400px);height:auto;aspect-ratio:5/7}.slot .trading-card{font-size:inherit}.tc-art img{pointer-events:none}@media(min-width:700px){.tc-title{font-size:18px}.tc-role{font-size:15px}.tc-lore{font-size:12px}.tc-bottom{font-size:13px}.tc-date{font-size:11px}}.collectible{width:100%;height:100%;padding:5%;display:flex;flex-direction:column;gap:2%;overflow:hidden;border:4px double #e4be78;border-radius:5%;background:radial-gradient(ellipse at 50% 20%,#59412b,#241c1c 60%,#111019);color:#f7dca9;box-shadow:inset 0 0 0 3px #8e5b32,0 14px 35px #000a;font-family:Georgia,serif}.card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:10%;border-bottom:1px solid #a97c48}.card-name{font-size:clamp(12px,3.3vw,21px);font-weight:bold;line-height:1.05;overflow-wrap:anywhere}.card-number{white-space:nowrap;font-size:clamp(10px,2vw,14px)}.card-art{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border:2px ridge #d2a768;background:radial-gradient(circle,#735c44,#29252b 80%);border-radius:4%;position:relative}.card-art img{width:100%;height:100%;object-fit:contain;filter:none}.card-art .fallback{font-size:12px;text-align:center}.card-role{text-align:center;border-bottom:1px solid #997548;font-size:clamp(10px,2.4vw,15px);letter-spacing:.06em;padding:2% 0}.card-lore{min-height:17%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(10px,2vw,14px);line-height:1.25;color:#dac49e}.card-bottom{display:flex;justify-content:space-between;gap:3px;padding-top:3%;border-top:1px solid #997548;font-size:clamp(9px,1.9vw,13px);white-space:nowrap}.overlay .collectible{height:auto;aspect-ratio:5/7;width:min(90vw,400px);max-height:89dvh}.overlay .card-name{font-size:clamp(15px,4vw,22px)}.overlay .card-role{font-size:clamp(12px,3vw,17px)}.overlay .card-lore{font-size:clamp(12px,3vw,16px)}.sortbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px auto 0;padding:0 18px;max-width:680px}.sortbar label{font:700 10px Georgia,serif;letter-spacing:.16em;color:#d7a66a;white-space:nowrap}.sortbar select,.sortbar button{background:#211910;color:#f4d7a8;border:1px solid #996f44;border-radius:8px;font-size:14px;min-height:40px;padding:8px 10px}.sortbar select{flex:1;max-width:310px;min-width:0}.sortbar button{min-width:44px;cursor:pointer}.sortbar select:focus-visible,.sortbar button:focus-visible{outline:2px solid #f3ce92;outline-offset:2px}.overlay{flex-direction:column;gap:12px;cursor:default}.overlay-card{width:min(90vw,400px);aspect-ratio:5/7;max-height:calc(92dvh - 76px);display:grid;place-items:center}.overlay-card>.collectible,.overlay-card>.locked{width:100%;height:100%}.overlay-actions{display:flex;justify-content:center;align-items:center;gap:10px}.overlay-actions button{border:1px solid #bd905b;border-radius:10px;padding:10px 18px;background:#281b13;color:#ffe0aa;cursor:pointer;font:600 14px Georgia,serif}.overlay-actions button:disabled{opacity:.6;cursor:wait}.overlay-actions button:focus-visible{outline:2px solid #ffe0aa}.overlay-status{min-height:1em;font:12px system-ui,sans-serif;color:#e8c99d;text-align:center}.overlay .collectible{width:100%;height:100%;max-height:none}.overlay .locked{height:100%}.filterbar{max-width:680px;margin:13px auto 0;padding:0 18px;display:flex;align-items:flex-start;gap:10px}.filter-label{font:700 10px Georgia,serif;letter-spacing:.16em;color:#d7a66a;padding-top:10px;white-space:nowrap}.filter-chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}.filter-chip{border:1px solid #956d42;border-radius:999px;background:#211910;color:#e0bd8b;font:600 13px Georgia,serif;padding:9px 13px;cursor:pointer;min-height:36px}.filter-chip[aria-pressed="true"]{background:#e1b977;border-color:#ffe0a4;color:#24180d;box-shadow:0 0 0 1px #ab7a47}.filter-chip:focus-visible{outline:2px solid #ffe1a6;outline-offset:2px}.no-results{width:min(90vw,360px);padding:24px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#d6b98b;border:1px solid #8b603a;border-radius:14px;background:#1c1510;line-height:1.55}.collectible .card-lore{display:flex;min-height:17%;max-height:20%;overflow:hidden;line-height:1.25;overflow-wrap:anywhere;padding:1% 2%;flex-shrink:0}.collectible .card-art{flex:1;min-height:0}.collectible .card-role{padding:2% 0;min-height:0;display:block;flex-shrink:0}.collectible .card-top,.collectible .card-bottom{flex-shrink:0}.overlay-card{perspective:1400px;cursor:pointer}.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.25,1)}.overlay.flipped .flip-inner{transform:rotateY(180deg)}.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:5%}.flip-face>.collectible,.flip-face>.locked{width:100%;height:100%}.flip-back{transform:rotateY(180deg)}.collectible-back{justify-content:center;align-items:center;gap:4%;padding:7%;background:radial-gradient(ellipse at 50% 40%,#4b3625,#171217 77%)}.back-logo{width:88%;max-height:56%;display:grid;place-items:center;min-height:0;flex-shrink:1}.back-logo img{display:block;width:100%;height:100%;max-height:100%;object-fit:contain;filter:none}.back-details{width:100%;min-height:0;max-height:45%;flex:0 1 auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid #b58a54;padding:10px 2% 0;text-align:center}.back-title{color:#ffe0a4;font-size:clamp(13px,3.2vw,20px);font-weight:bold}.back-scroll{font-size:clamp(11px,2.6vw,15px);line-height:1.45;overflow:auto;min-height:0;overflow-wrap:anywhere;white-space:pre-wrap;color:#f0d2a9;padding:0 4px}.overlay.flipped .flip-front{pointer-events:none}.overlay:not(.flipped) .flip-back{pointer-events:none}@media(prefers-reduced-motion:reduce){.flip-inner{transition:none}}</style></head><body><header><small>WILLY CORP. PRESENTS</small><h1>THE WILLY-DEX</h1><p>Pirate Cove · Collector's Registry</p></header><div class="bar"><input id="search" placeholder="Search players or card numbers" aria-label="Search cards"><span id="count">1 / 100</span></div><div class="sortbar"><label for="sort">SORT BY</label><select id="sort" aria-label="Sort cards"><option value="number">Card number</option><option value="age">SMMO age · oldest first</option><option value="level">Level · highest first</option><option value="guild">Guild · A–Z</option></select><button id="reverse" type="button" aria-label="Reverse sort direction" title="Reverse sort direction">↓</button></div><div class="filterbar" role="group" aria-label="Filter cards by roles"><span class="filter-label">SHOW ONLY</span><div id="filter-chips" class="filter-chips"></div></div><div class="wheel" id="wheel" aria-label="Rotating card selector"><div class="stage" id="stage"></div></div><div class="controls"><button id="prev" aria-label="Previous card">‹</button><span id="selected">#001</span><button id="next" aria-label="Next card">›</button></div><p class="tip">SWIPE OR SCROLL TO ROTATE · TAP CARD TO OPEN · DOWNLOAD CARD OR CLOSE</p><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Card detail" tabindex="-1"></div><script>

let cards=Array.from({length:100},(_,i)=>({number:String(i+1).padStart(3,'0'),name:'???',placeholder:true})),filtered=cards;
const stage=document.getElementById('stage'),wheel=document.getElementById('wheel'),overlay=document.getElementById('overlay'),search=document.getElementById('search');
const slots=[];let position=0,target=null,velocity=0,lastTime=0,raf=0,dragging=false,dragStart=0,dragLast=0,dragTime=0,travel=0,ignoreClickUntil=0;
const sortSelect=document.getElementById('sort'),reverseButton=document.getElementById('reverse');let descending=false;
const filterChips=document.getElementById('filter-chips'),activeTags=new Set();
function normalizeTag(value){const tag=String(value??'').trim().replace(/\s+/g,' ');if(!tag)return '';if(/^(guild[\s-]*(lead|leader|master)|guildmaster)$/i.test(tag))return 'Guild Lead';if(/^(artist|illustrator|designer)$/i.test(tag))return 'Artist';return tag}
function cardTags(c){const raw=Array.isArray(c.tags)?c.tags:[];const tags=raw.map(normalizeTag).filter(Boolean);const role=String(c.type||'');if(/guild[\s-]*(lead|leader|master)|guildmaster/i.test(role))tags.push('Guild Lead');if(/\b(artist|illustrator|designer)\b/i.test(role))tags.push('Artist');return [...new Map(tags.map(tag=>[tag.toLocaleLowerCase(),tag])).values()]}
function drawFilters(){const discovered=new Map();for(const c of cards){if(!c.name||c.name==='???')continue;for(const tag of cardTags(c)){const key=tag.toLocaleLowerCase();if(!discovered.has(key))discovered.set(key,tag)}}const labels=[...discovered.values()].sort((a,b)=>a.localeCompare(b));for(const active of [...activeTags])if(!discovered.has(active.toLocaleLowerCase()))activeTags.delete(active);filterChips.replaceChildren();for(const name of ['All',...labels]){const button=document.createElement('button');button.type='button';button.className='filter-chip';button.textContent=name;button.setAttribute('aria-pressed',String(name==='All'?activeTags.size===0:activeTags.has(name)));button.addEventListener('click',()=>{if(name==='All')activeTags.clear();else if(activeTags.has(name))activeTags.delete(name);else activeTags.add(name);drawFilters();refreshCards()});filterChips.append(button)}}

const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const portraits=new Map();
function frontContent(c){if(!c.image&&(c.name==='???'||!c.name))return '<div class="locked"><b>WILLY CORP. · #'+safe(c.number)+'</b><strong>???</strong><b>UNDISCOVERED</b></div>';const art=c.portrait||c.image;const lore=String(c.front_text??c.description??'').trim();const frontLore=lore.length>78?'FLIP FOR FULL STORY':(lore||'');return '<article class="collectible"><div class="card-top"><span class="card-name">'+safe(c.name)+'</span><span class="card-number">#'+safe(c.number)+'</span></div><div class="card-art">'+(art?'<img draggable="false" src="'+safe(encodeURI(art))+'" alt="Portrait of '+safe(c.name)+'" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fallback" hidden>PORTRAIT UNAVAILABLE</span>':'<span class="fallback">PORTRAIT UNAVAILABLE</span>')+'</div><div class="card-role">'+safe(c.type||'PIRATE COVE')+'</div><div class="card-lore">'+safe(frontLore)+'</div><div class="card-bottom"><span>LVL '+safe(c.level??'—')+'</span><span>'+safe(c.date||'')+'</span></div></article>'}
function backContent(c){const lore=String(c.back_text??c.description??'').trim();return '<article class="collectible collectible-back"><div class="back-logo"><img src="'+safe(window.WILLY_CORP_LOGO||'')+'" alt="Willy Corp logo"></div>'+(lore?'<div class="back-details"><div class="back-title">'+safe(c.name)+'</div><div class="back-scroll">'+safe(lore)+'</div></div>':'')+'</article>'}
function content(c){return frontContent(c)}

function wrap(i,n){return ((i%n)+n)%n}
function deltaFor(i){const n=filtered.length;return wrap(i-position+n/2,n)-n/2}
function sortedCards(){const q=search.value.trim().toLowerCase();const matches=cards.filter(c=>([c.number,c.name,c.type,c.guild,...cardTags(c)].join(' ')).toLowerCase().includes(q)&&(activeTags.size===0||cardTags(c).some(tag=>activeTags.has(tag))));const field=sortSelect.value;const dateValue=c=>{const raw=c.smmo_joined||c.smmoJoined||c.smmo_join_date;const n=raw?Date.parse(raw):NaN;return Number.isFinite(n)?n:null};const fieldValue=c=>field==='level'?(Number.isFinite(Number(c.level))&&c.level!==null?Number(c.level):null):field==='age'?dateValue(c):field==='guild'?(c.guild&&c.guild!=='???'?c.guild:null):Number(c.number);return matches.sort((a,b)=>{const av=fieldValue(a),bv=fieldValue(b);if(av===null&&bv!==null)return 1;if(bv===null&&av!==null)return -1;if(av===null&&bv===null)return Number(a.number)-Number(b.number);let order=field==='guild'?String(av).localeCompare(String(bv),undefined,{sensitivity:'base'}):av-bv;if(field==='level')order=-order;if(descending)order=-order;return order||Number(a.number)-Number(b.number)})}
function refreshCards(){stop();const current=filtered.length?filtered[wrap(Math.round(position),filtered.length)]?.number:null;filtered=sortedCards();const existing=current?filtered.findIndex(c=>c.number===current):-1;position=existing>=0?existing:0;build()}
function build(){stage.innerHTML='';slots.length=0;document.getElementById('count').textContent=activeTags.size||search.value.trim()?filtered.filter(c=>c.name&&c.name!=='???').length+' MATCHES':cards.filter(c=>c.image||(c.name&&c.name!=='???')).length+' / 100';if(!filtered.length){document.getElementById('selected').textContent='0 MATCHES';const el=document.createElement('div');el.className='no-results';el.textContent='No cards match these filters. Choose All to see the full collection.';stage.append(el);return}filtered.forEach((c,i)=>{const el=document.createElement('div');el.className='slot';el.innerHTML=content(c);el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','Card '+c.number+' '+c.name);el.addEventListener('click',()=>{if(performance.now()<ignoreClickUntil)return;const d=deltaFor(i);if(Math.abs(d)<.45){stop();open(c)}else spinTo(position+d)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});stage.append(el);slots.push(el)});paint()}
function paint(){if(!filtered.length)return;const width=Math.min(wheel.clientWidth*.42,360),nearest=wrap(Math.round(position),filtered.length);document.getElementById('selected').textContent='#'+filtered[nearest].number;for(let i=0;i<slots.length;i++){const d=deltaFor(i),a=Math.abs(d),el=slots[i];if(a>5.2){el.style.display='none';continue}el.style.display='grid';const angle=Math.max(-82,Math.min(82,d*23)),rad=angle*Math.PI/180;el.style.transform='translate(-50%,-50%) translateX('+Math.sin(rad)*width+'px) translateZ('+(-a*95)+'px) rotateY('+(-angle*.86)+'deg) scale('+(1-Math.min(a,5)*.09)+')';el.style.opacity=String(Math.max(0,1-a*.18));el.style.filter='brightness('+(1-a*.13)+')';el.style.zIndex=String(100-Math.round(a*10));el.style.pointerEvents=a>3.8?'none':'auto'}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;target=null;velocity=0;lastTime=0}
function frame(now){const dt=Math.min((now-(lastTime||now))/16.667,2);lastTime=now;if(target!==null){const diff=target-position;velocity+=diff*.085*dt;velocity*=Math.pow(.72,dt);position+=velocity*dt;if(Math.abs(diff)<.002&&Math.abs(velocity)<.002){position=target;velocity=0;target=null}}else{position+=velocity*dt;velocity*=Math.pow(.947,dt);if(Math.abs(velocity)<.012){target=Math.round(position);velocity=0}}paint();if(target!==null||Math.abs(velocity)>.001)raf=requestAnimationFrame(frame);else{raf=0;lastTime=0}}
function run(){if(!raf){lastTime=0;raf=requestAnimationFrame(frame)}}
function spinTo(p){if(!filtered.length)return;if(reduced.matches){stop();position=Math.round(p);paint();return}target=p;run()}
function step(n){if(!filtered.length)return;spinTo(Math.round(target??position)+n)}
function flipOpenCard(){const flipped=overlay.classList.toggle('flipped');const button=document.getElementById('flip-card');if(button)button.textContent=flipped?'↻ Show Front':'↻ Flip Card';button?.setAttribute('aria-pressed',String(flipped))}
function open(c){overlay.dataset.card=c.number;overlay.classList.remove('flipped');overlay.innerHTML='<div class="overlay-card"><div class="flip-inner"><div class="flip-face flip-front">'+frontContent(c)+'</div><div class="flip-face flip-back">'+backContent(c)+'</div></div></div><div class="overlay-actions"><button type="button" id="flip-card" aria-pressed="false">↻ Flip Card</button><button type="button" id="download-card">↓ Download PNG</button><button type="button" id="close-card">Close</button></div><div class="overlay-status" id="download-status" role="status" aria-live="polite"></div>';overlay.classList.add('open');overlay.focus();document.getElementById('close-card').onclick=close;document.getElementById('flip-card').onclick=flipOpenCard;document.querySelector('.overlay-card').onclick=flipOpenCard;document.getElementById('download-card').onclick=()=>window.willyDexDownload(c,overlay.classList.contains('flipped')?'back':'front')}

function close(){overlay.classList.remove('open','flipped')}
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
wheel.addEventListener('wheel',e=>{e.preventDefault();if(overlay.classList.contains('open')||!filtered.length)return;target=null;position+=Math.max(-2.5,Math.min(2.5,(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*.004));velocity=Math.max(-.45,Math.min(.45,velocity+(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*.0002));paint();run()},{passive:false});
wheel.addEventListener('pointerdown',e=>{if(e.button!==0||!filtered.length)return;stop();dragging=true;dragStart=dragLast=e.clientX;dragTime=performance.now();travel=0;wheel.setPointerCapture(e.pointerId)});
wheel.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=e.clientX-dragLast,dt=Math.max(1,now-dragTime),amount=-dx/Math.max(75,wheel.clientWidth*.20);position+=amount;const instant=amount/(dt/16.667);velocity=velocity*.55+instant*.45;travel+=Math.abs(dx);dragLast=e.clientX;dragTime=now;paint()});
function release(){if(!dragging)return;dragging=false;ignoreClickUntil=travel>7?performance.now()+250:0;if(reduced.matches){position=Math.round(position);velocity=0;paint();return}if(performance.now()-dragTime>100)velocity=0;velocity=Math.max(-.65,Math.min(.65,velocity*1.2));run()}
wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);wheel.addEventListener('lostpointercapture',release);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(overlay.classList.contains('open')||document.activeElement===search)return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1)}});
search.oninput=refreshCards;sortSelect.onchange=refreshCards;reverseButton.onclick=()=>{descending=!descending;reverseButton.textContent=descending?'↑':'↓';reverseButton.setAttribute('aria-label',descending?'Use reverse sorting':'Use default sorting');refreshCards()};
fetch('cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{cards=data;drawFilters();filtered=sortedCards();position=0;build()}).catch(()=>build());
window.willyDexSetCards=function(updatedCards){cards=updatedCards;drawFilters();filtered=sortedCards();position=0;build()};
window.willyDexReload=async function(){const response=await fetch('cards.json?updated='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Unable to reload cards');cards=await response.json();drawFilters();filtered=sortedCards();position=0;build()};
window.addEventListener('resize',paint);drawFilters();build();
