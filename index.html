<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d0b"><title>The Willy-dex | Willy Corp</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 45%,#3d2b1d,#100d0b 72%);color:#f5dfb7;font-family:Georgia,serif;overflow-x:hidden}header{text-align:center;padding:24px 12px 6px}header small{color:#c78e52;letter-spacing:.34em}h1{font-size:clamp(36px,8vw,66px);letter-spacing:.09em;margin:8px 0}header p{color:#ad9272;margin:0}.bar{max-width:680px;margin:20px auto 0;padding:0 18px;display:flex;align-items:center;gap:14px}.bar input{width:100%;min-width:0;background:#1c1510;border:1px solid #8b603a;color:#f5dfb7;border-radius:9px;padding:13px;font-size:16px}.bar span{white-space:nowrap;color:#d7a66a;font-size:13px}.wheel{position:relative;height:min(62dvh,640px);min-height:360px;perspective:900px;touch-action:pan-y;overflow:hidden}.wheel:before,.wheel:after{content:'';position:absolute;z-index:5;left:0;right:0;height:18%;pointer-events:none}.wheel:before{top:0;background:linear-gradient(#100d0b,transparent)}.wheel:after{bottom:0;background:linear-gradient(transparent,#100d0b)}.stage{position:absolute;inset:0;transform-style:preserve-3d}.slot{position:absolute;top:50%;left:50%;width:clamp(170px,42vw,300px);aspect-ratio:5/7;display:grid;place-items:center;cursor:pointer;transition:transform .26s ease,opacity .26s ease,filter .26s ease;backface-visibility:hidden;outline:none}.slot:focus-visible{outline:2px solid #f3ce92}.slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 15px #0009)}.locked{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 10px;border:6px double #a97946;border-radius:13px;background:repeating-linear-gradient(125deg,#221b17,#221b17 14px,#2c221b 15px,#2c221b 28px);box-shadow:inset 0 0 0 5px #100c0a,0 15px 30px #0007;text-align:center;color:#d5a46d}.locked strong{font-size:clamp(48px,10vw,92px);letter-spacing:.1em;color:#c7a27b}.locked b{font-size:clamp(11px,2vw,16px);letter-spacing:.13em}.controls{display:flex;align-items:center;justify-content:center;gap:25px;margin:0 auto}.controls button{border:1px solid #a77542;border-radius:50%;width:48px;height:48px;background:#20170f;color:#f2d3a2;font-size:30px;cursor:pointer}.controls span{min-width:90px;text-align:center;color:#d9a86c}.tip{text-align:center;font-size:11px;letter-spacing:.1em;color:#a28b70;margin:18px 10px}.overlay{position:fixed;inset:0;background:#070504ed;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.overlay.open{display:flex}.overlay img{max-width:min(95vw,540px);max-height:92dvh;object-fit:contain}.overlay .locked{width:min(90vw,400px);height:min(80dvh,560px)}.overlay small{position:absolute;bottom:7px;color:#c5a279}@media(prefers-reduced-motion:reduce){.slot{transition:none}}
</style></head><body><header><small>WILLY CORP. PRESENTS</small><h1>THE WILLY-DEX</h1><p>Pirate Cove · Collector's Registry</p></header><div class="bar"><input id="search" placeholder="Search names or card numbers" aria-label="Search cards"><span id="count">1 / 100</span></div><div class="wheel" id="wheel" aria-label="Rotating card selector"><div class="stage" id="stage"></div></div><div class="controls"><button id="prev" aria-label="Previous card">‹</button><span id="selected">#001</span><button id="next" aria-label="Next card">›</button></div><p class="tip">SWIPE OR SCROLL TO ROTATE · TAP CARD TO OPEN · TAP AGAIN TO CLOSE</p><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Card detail" tabindex="-1"></div><script>
let cards=Array.from({length:100},(_,i)=>({number:String(i+1).padStart(3,'0'),name:'???',placeholder:true})),filtered=cards,index=0;const stage=document.getElementById('stage'),wheel=document.getElementById('wheel'),overlay=document.getElementById('overlay'),search=document.getElementById('search');function safe(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function content(c){return c.image?'<img src="'+encodeURI(c.image)+'" alt="Card #'+c.number+': '+safe(c.name)+'">':'<div class="locked"><b>WILLY CORP. · #'+c.number+'</b><strong>???</strong><b>UNDISCOVERED</b></div>'}function draw(){stage.innerHTML='';document.getElementById('count').textContent=cards.filter(c=>!!c.image).length+' / 100';if(!filtered.length){document.getElementById('selected').textContent='NO MATCH';return}index=(index+filtered.length)%filtered.length;document.getElementById('selected').textContent='#'+filtered[index].number;for(let delta=-4;delta<=4;delta++){let i=(index+delta+filtered.length)%filtered.length,c=filtered[i],el=document.createElement('div');el.className='slot';el.innerHTML=content(c);let a=Math.abs(delta),angle=delta*24,rad=angle*Math.PI/180;el.style.transform='translate(-50%,-50%) translateX('+Math.sin(rad)*Math.min(innerWidth*.45,370)+'px) translateZ('+(-a*105)+'px) rotateY('+(-angle*.85)+'deg) scale('+(1-a*.095)+')';el.style.opacity=String(Math.max(.18,1-a*.19));el.style.filter='brightness('+(1-a*.14)+')';el.style.zIndex=String(10-a);el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','Card '+c.number+' '+c.name);el.onclick=()=>delta===0?open(c):(index=i,draw());el.onkeydown=e=>{if(e.key==='Enter')el.click()};stage.append(el)}}function open(c){overlay.innerHTML=content(c)+'<small>TAP TO CLOSE</small>';overlay.classList.add('open');overlay.focus()}function close(){overlay.classList.remove('open')}overlay.onclick=close;function move(n){if(!filtered.length)return;index=(index+n+filtered.length)%filtered.length;draw()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);let lock=false;wheel.addEventListener('wheel',e=>{e.preventDefault();if(lock)return;lock=true;move(Math.sign(e.deltaY||e.deltaX));setTimeout(()=>lock=false,125)},{passive:false});let startX=0,startY=0;wheel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});wheel.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY,d=Math.abs(dx)>Math.abs(dy)?dx:dy;if(Math.abs(d)>30)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(overlay.classList.contains('open')||document.activeElement===search)return;if(e.key==='ArrowRight'||e.key==='ArrowDown')move(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')move(-1)});search.oninput=()=>{let q=search.value.trim().toLowerCase();filtered=cards.filter(c=>(c.number+' '+c.name+' '+(c.type||'')).toLowerCase().includes(q));index=0;draw()};fetch('cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{cards=data;filtered=cards;draw()}).catch(()=>draw());window.addEventListener('resize',draw);draw();
</script></body></html>
