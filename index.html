:root{color-scheme:dark;--gold:#d4a36b;--ink:#100d0a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#3b2a19,#0b0b0b 70%);font-family:Georgia,serif;color:#f3e0bb}header{text-align:center;padding:24px 12px 8px}header small{letter-spacing:.32em;color:var(--gold)}h1{margin:5px 0;font-size:clamp(36px,8vw,70px);letter-spacing:.08em;text-shadow:0 2px 18px #a86c3544}header p{margin:0;color:#b8a28a}main{max-width:1100px;margin:auto}nav{display:flex;gap:10px;align-items:center;justify-content:center;padding:20px 12px}input{font-size:16px;padding:12px 16px;border:1px solid #765638;background:#17130e;color:#f3e0bb;border-radius:9px;width:min(65vw,440px)}#count{color:var(--gold);font-size:14px;white-space:nowrap}#wheel{height:min(68dvh,670px);min-height:410px;position:relative;overflow:hidden;touch-action:pan-y;perspective:1050px}#stage{height:100%;position:relative;transform-style:preserve-3d}.slot{position:absolute;top:50%;left:50%;width:min(52vw,310px);aspect-ratio:5/7;border-radius:12px;cursor:pointer;overflow:hidden;border:2px solid #9e7347;background:linear-gradient(130deg,#48301d,#100e0c 55%,#332012);box-shadow:0 15px 38px #000b;display:grid;place-items:center;transition:transform .3s ease,opacity .3s ease,filter .3s ease;transform-style:preserve-3d}.slot img{width:100%;height:100%;object-fit:cover}.locked{height:100%;width:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px 10px;text-align:center;border:7px double #8a613b;box-shadow:inset 0 0 50px #000}.locked b{color:#cda373;font-size:clamp(10px,2vw,15px);letter-spacing:.12em}.locked strong{font-size:clamp(50px,12vw,95px);color:#7c634d;text-shadow:0 0 20px #000}.controls{display:flex;justify-content:center;align-items:center;gap:30px;padding:5px 0 30px}button{cursor:pointer;background:#241b14;border:1px solid #a77b50;color:#f3e0bb;border-radius:8px;padding:10px 18px;font-size:22px}#selected{color:var(--gold);min-widt </style></head><body><header><small>WILLY CORP. PRESENTS</small><h1>THE WILLY-DEX</h1><p>The Pirate Cove · Collectible Registry</p></header><main><nav><input id="search" placeholder="Search by name or number…" aria-label="Search cards"><span id="count">1 / 100</span></nav><div id="wheel"><div id="stage"></div></div><div class="controls"><button id="prev" aria-label="Previous card">‹</button><strong id="selected">#001</strong><button id="next" aria-label="Next card">›</button></div><p class="hint">SWIPE OR SCROLL TO ROTATE · TAP CARD TO OPEN · TAP AGAIN TO CLOSE</p></main><div id="overlay" tabindex="-1" role="dialog" aria-label="Collectible card"></div><script>
let cards=Array.from({length:100},(_,i)=>({number:String(i+1).padStart(3,'0'),name:'???',type:'???',image:null})),filtered=cards,index=0;const stage=document.getElementById('stage'),wheel=document.getElementById('wheel'),overlay=document.getElementById('overlay'),search=document.getElementById('search');function safe(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function content(c){return c.image?'<img src="'+encodeURI(c.image)+'" alt="Card #'+safe(c.number)+': '+safe(c.name)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'fallback\',textContent:\'Card image unavailable\'}))">':'<div class="locked"><b>WILLY CORP. · #'+safe(c.number)+'</b><strong>???</strong><b>UNDISCOVERED</b></div>'}function draw(){stage.innerHTML='';document.getElementById('count').textContent=cards.filter(c=>!!c.image).length+' / 100';if(!filtered.length){document.getElementById('selected').textContent='NO MATCH';return}index=(index+filtered.length)%filtered.length;document.getElementById('selected').textContent='#'+filtered[index].number;for(let delta=-4;delta<=4;delta++){let i=(index+delta+filtered.length)%filtered.length,c=filtered[i],el=document.createElement('div');el.className='slot';el.innerHTML=content(c);let a=Math.abs(delta),angle=delta*24,rad=angle*Math.PI/180;el.style.transform='translate(-50%,-50%) translateX('+Math.sin(rad)*Math.min(innerWidth*.43,350)+'px) translateZ('+(-a*105)+'px) rotateY('+(-angle*.85)+'deg) scale('+(1-a*.095)+')';el.style.opacity=String(Math.max(.18,1-a*.19));el.style.filter='brightness('+(1-a*.14)+')';el.style.zIndex=String(10-a);el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','Card '+c.number+' '+c.name);el.onclick=()=>delta===0?open(c):(index=i,draw());el.onkeydown=e=>{if(e.key==='Enter')el.click()};stage.append(el)}}function open(c){overlay.innerHTML=content(c)+'<small>TAP TO CLOSE</small>';overlay.classList.add('open');overlay.focus()}function close(){overlay.classList.remove('open')}overlay.onclick=close;function move(n){if(!filtered.length)return;index=(index+n+filtered.length)%filtered.length;draw()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);let lock=false;wheel.addEventListener('wheel',e=>{e.preventDefault();if(lock)return;lock=true;move(Math.sign(e.deltaY||e.deltaX));setTimeout(()=>lock=false,125)},{passive:false});let startX=0,startY=0;wheel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});wheel.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY,d=Math.abs(dx)>Math.abs(dy)?dx:dy;if(Math.abs(d)>30)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(overlay.classList.contains('open')||document.activeElement===search)return;if(e.key==='ArrowRight'||e.key==='ArrowDown')move(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')move(-1)});search.oninput=()=>{let q=search.value.trim().toLowerCase();filtered=cards.filter(c=>(c.number+' '+c.name+' '+(c.type||'')).toLowerCase().includes(q));index=0;draw()};fetch('cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{cards=data;filtered=cards;draw()}).catch(()=>draw());window.addEventListener('resize',draw);draw();
</script></body></html>
