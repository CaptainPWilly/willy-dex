<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e0d"><title>The Willy-dex | Pirate Cove</title>
<style>
:root{color-scheme:dark;--cream:#f3dfb8;--copper:#c58254;--dim:#988572}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 22%,#302217,#100e0d 68%);color:var(--cream);font-family:Georgia,serif}header{text-align:center;padding:30px 15px 8px}header small{letter-spacing:.36em;color:var(--copper)}h1{font-size:clamp(32px,8vw,64px);letter-spacing:.1em;margin:8px 0}header p{color:var(--dim);margin:0}main{max-width:640px;margin:auto;padding:12px 18px 55px}.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:12px 0 20px}.top input{min-width:0;width:100%;padding:12px 15px;border:1px solid #71513b;border-radius:8px;background:#191410;color:var(--cream);font-size:16px}.counter{white-space:nowrap;font-size:13px;color:var(--copper)}.selector{height:min(64dvh,650px);min-height:390px;overflow-y:auto;scroll-snap-type:y mandatory;perspective:900px;perspective-origin:50% 50%;scrollbar-width:thin;scrollbar-color:#7b5033 transparent;mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);padding:calc(min(64dvh,650px)/2 - 57px) 0}.entry{display:flex;align-items:center;gap:16px;width:100%;height:114px;margin:0 0 6px;padding:12px 17px;text-align:left;background:#1c1713;border:1px solid #3b2c21;border-radius:11px;color:var(--cream);scroll-snap-align:center;cursor:pointer;transform-origin:50% 50%;will-change:transform,opacity;transition:border-color .15s,background .15s}.entry:hover,.entry:focus-visible,.entry.active{border-color:var(--copper);background:#2e2017;outline:none}.num{color:var(--copper);font-size:22px;min-width:58px}.name{font-size:clamp(18px,4vw,24px)}.role{color:var(--dim);font-size:12px;margin-top:7px;letter-spacing:.08em}.mystery .name{letter-spacing:.16em;color:#9b8574}.seal{margin-left:auto;color:#644c39;font-size:27px}.selector-wrap{position:relative}.selector-wrap:before,.selector-wrap:after{content:'';pointer-events:none;position:absolute;left:-8px;right:-8px;top:50%;height:1px;background:linear-gradient(90deg,transparent,#b57a4a55,transparent);z-index:1}.selector-wrap:before{transform:translateY(-64px)}.selector-wrap:after{transform:translateY(64px)}.hint{text-align:center;color:var(--dim);font-size:12px;margin-top:12px;letter-spacing:.06em}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#070605eb;z-index:10;padding:20px;cursor:pointer}.overlay.show{display:grid}.card{width:min(100%,420px);min-height:560px;max-height:90dvh;overflow:auto;border:4px double var(--copper);border-radius:15px;background:linear-gradient(150deg,#332318,#16110e 65%);box-shadow:0 15px 75px #000;padding:25px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-around}.card .id{color:var(--copper);letter-spacing:.25em}.card h2{font-size:clamp(27px,7vw,39px);margin:10px 0}.card .crest{font-size:94px;filter:sepia(.5)}.card .details{border-top:1px solid #765038;border-bottom:1px solid #765038;padding:18px 0;width:100%;line-height:1.7}.card .type{color:var(--copper);letter-spacing:.15em}.card .close{color:var(--dim);font-size:12px}.card .snapshot{display:flex;justify-content:space-between;gap:12px;width:100%;margin-top:auto;padding-top:18px;font-size:13px;color:var(--copper);border-top:1px solid #765038}.card .snapshot span:last-child{text-align:right}.card img{max-width:100%;max-height:78dvh;object-fit:contain}.empty{text-align:center;color:var(--dim);padding:80px 10px}@media(prefers-reduced-motion:reduce){.entry{transition:none}}
</style></head>
<body><header><small>WILLY CORP. PRESENTS</small><h1>THE WILLY-DEX</h1><p>Pirate Cove · Collector's Registry</p></header>
<main><div class="top"><input id="search" type="search" placeholder="Search cards or numbers…" aria-label="Search cards"><span class="counter" id="counter">1 / 100</span></div><div class="selector-wrap"><div id="selector" class="selector" aria-label="Card selection"></div></div><p class="hint">SCROLL TO SELECT · TAP TO OPEN · TAP AGAIN TO CLOSE</p></main>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Collectible card" tabindex="-1"><div id="card" class="card"></div></div>
<script>
const cards=Array.from({length:100},(_,i)=>({number:String(i+1).padStart(3,'0'),name:'???',type:'???',placeholder:true}));
cards[0]={number:'001',name:'Captain P Willy',type:'Guild Lead',tag:'[[ARG]]',titles:['Captain'],level:'7504',date:'19 October 2026',bio:'Proud leader of the Pirate Cove.',joined:'15 April 2022',notes:['Founded The Pirate Cove guild.','ARG!'],placeholder:false};
const list=document.getElementById('selector'),search=document.getElementById('search'),overlay=document.getElementById('overlay'),card=document.getElementById('card');
let current=null;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let wheelFrame=0;function updateWheel(){wheelFrame=0;const center=list.getBoundingClientRect().top+list.clientHeight/2;const entries=list.querySelectorAll('.entry');for(const el of entries){const b=el.getBoundingClientRect(),distance=(b.top+b.height/2-center)/120,angle=Math.max(-75,Math.min(75,distance*23)),depth=Math.abs(distance);el.style.transform='translateX('+(-Math.min(depth,4)*13)+'px) rotateX('+(-angle)+'deg) scale('+(1-Math.min(depth,5)*.065)+')';el.style.opacity=String(Math.max(.3,1-depth*.17));el.classList.toggle('active',Math.abs(distance)<.52)}}function queueWheel(){if(!wheelFrame)wheelFrame=requestAnimationFrame(updateWheel)}list.addEventListener('scroll',queueWheel,{passive:true});window.addEventListener('resize',queueWheel);function render(){const q=search.value.toLowerCase().trim();const visible=cards.filter(c=>[c.number,c.name,c.type,...(c.titles||[])].join(' ').toLowerCase().includes(q));list.innerHTML=visible.map(c=>'<button class="entry '+(c.placeholder?'mystery':'')+'" data-n="'+c.number+'"><span class="num">#'+c.number+'</span><span><div class="name">'+escapeHTML(c.name)+'</div><div class="role">'+escapeHTML(c.type)+'</div></span><span class="seal">'+(c.placeholder?'?':'✦')+'</span></button>').join('')||'<p class="empty">No cards found.</p>';queueWheel();document.getElementById('counter').textContent=cards.filter(c=>!c.placeholder).length+' / 100 discovered'}
function openCard(c){current=c;card.innerHTML='<div class="id">WILLY CORP. · #'+c.number+'</div><div class="crest">'+(c.placeholder?'❔':'⚓')+'</div><h2>'+escapeHTML(c.name)+'</h2><div class="type">'+escapeHTML(c.type)+'</div><div class="details">'+(c.placeholder?'UNDISCOVERED<br>???':(escapeHTML((c.titles||[]).join(' · '))+'<br>'+escapeHTML(c.bio||'')+'<br>Joined '+escapeHTML(c.joined||'???')+'<br>'+escapeHTML((c.notes||[]).join(' · '))))+'</div><div class="snapshot"><span>LVL '+(c.placeholder?'???':escapeHTML(c.level||'???'))+'</span><span>'+(c.placeholder?'???':escapeHTML(c.date||'Date unknown'))+'</span></div><div class="close">TAP ANYWHERE TO CLOSE</div>';overlay.classList.add('show');overlay.focus()}
function closeCard(){overlay.classList.remove('show');current=null}
list.addEventListener('click',e=>{const el=e.target.closest('[data-n]');if(el)openCard(cards[Number(el.dataset.n)-1])});
search.addEventListener('input',render);overlay.addEventListener('click',closeCard);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();if(overlay.classList.contains('show'))return;if(['ArrowDown','ArrowUp'].includes(e.key)&&document.activeElement!==search){e.preventDefault();const entries=[...list.querySelectorAll('.entry')];let i=entries.indexOf(document.activeElement);i=Math.max(0,Math.min(entries.length-1,i+(e.key==='ArrowDown'?1:-1)));entries[i]?.focus();entries[i]?.scrollIntoView({block:'center',behavior:'smooth'})}if(e.key==='Enter'&&document.activeElement.classList.contains('entry'))document.activeElement.click()});
render();
</script></body></html>
