<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d0b"><title>The Willy-dex | Willy Corp</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 45%,#3d2b1d,#100d0b 72%);color:#f5dfb7;font-family:Georgia,serif;overflow-x:hidden}header{text-align:center;padding:24px 12px 6px}header small{color:#c78e52;letter-spacing:.34em}h1{font-size:clamp(36px,8vw,66px);letter-spacing:.09em;margin:8px 0}header p{color:#ad9272;margin:0}.bar{max-width:680px;margin:20px auto 0;padding:0 18px;display:flex;align-items:center;gap:14px}.bar input{width:100%;min-width:0;background:#1c1510;border:1px solid #8b603a;color:#f5dfb7;border-radius:9px;padding:13px;font-size:16px}.bar span{white-space:nowrap;color:#d7a66a;font-size:13px}.wheel{position:relative;height:min(62dvh,640px);min-height:360px;perspective:900px;touch-action:none;overflow:hidden}.wheel:before,.wheel:after{content:'';position:absolute;z-index:5;left:0;right:0;height:18%;pointer-events:none}.wheel:before{top:0;background:linear-gradient(#100d0b,transparent)}.wheel:after{bottom:0;background:linear-gradient(transparent,#100d0b)}.stage{position:absolute;inset:0;transform-style:preserve-3d}.slot{position:absolute;top:50%;left:50%;width:clamp(170px,42vw,300px);aspect-ratio:5/7;display:grid;place-items:center;cursor:pointer;backface-visibility:hidden;outline:none}.slot:focus-visible{outline:2px solid #f3ce92}.slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 15px #0009)}.locked{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 10px;border:6px double #a97946;border-radius:13px;background:repeating-linear-gradient(125deg,#221b17,#221b17 14px,#2c221b 15px,#2c221b 28px);box-shadow:inset 0 0 0 5px #100c0a,0 15px 30px #0007;text-align:center;color:#d5a46d}.locked strong{font-size:clamp(48px,10vw,92px);letter-spacing:.1em;color:#c7a27b}.locked b{font-size:clamp(11px,2vw,16px);letter-spacing:.13em}.controls{display:flex;align-items:center;justify-content:center;gap:25px;margin:0 auto}.controls button{border:1px solid #a77542;border-radius:50%;width:48px;height:48px;background:#20170f;color:#f2d3a2;font-size:30px;cursor:pointer}.controls span{min-width:90px;text-align:center;color:#d9a86c}.tip{text-align:center;font-size:11px;letter-spacing:.1em;color:#a28b70;margin:18px 10px}.overlay{position:fixed;inset:0;background:#070504ed;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.overlay.open{display:flex}.overlay img{max-width:min(95vw,540px);max-height:92dvh;object-fit:contain}.overlay .locked{width:min(90vw,400px);height:min(80dvh,560px)}.overlay small{position:absolute;bottom:7px;color:#c5a279}@media(prefers-reduced-motion:reduce){.slot{transition:none}}
.trading-card{width:100%;height:100%;position:relative;overflow:hidden;border:5px ridge #c79b58;border-radius:14px;background:radial-gradient(ellipse at 50% 25%,#513921,#17151b 72%);box-shadow:inset 0 0 0 3px #3e2815,0 12px 30px #0009;padding:clamp(9px,2.5%,17px);display:flex;flex-direction:column;gap:2%;color:#f8e6be;text-align:center}.trading-card:after{content:"";position:absolute;inset:7px;border:1px solid #c69a59aa;border-radius:8px;pointer-events:none}.tc-top{height:15%;display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid #b6884f;padding:0 2px}.tc-title{font-size:clamp(10px,2.5vw,18px);font-weight:bold;letter-spacing:.03em;text-align:left;line-height:1.1;overflow-wrap:anywhere}.tc-number{font-size:clamp(8px,1.7vw,12px);color:#e9c68b;white-space:nowrap}.tc-art{height:49%;min-height:0;display:grid;place-items:center;overflow:hidden;border:2px solid #bc8b4d;border-radius:4px;background:radial-gradient(#654e32,#211a1b 76%);position:relative}.tc-art img{display:block;width:100%;height:100%;object-fit:contain;filter:none}.tc-art .missing{font-size:clamp(9px,2vw,14px);letter-spacing:.1em;color:#bba17c}.tc-role{font-size:clamp(9px,2vw,15px);font-weight:bold;letter-spacing:.04em;min-height:12%;display:grid;place-items:center;border-block:1px solid #866239;padding:3px;overflow-wrap:anywhere}.tc-lore{min-height:0;flex:1;display:grid;place-items:center;color:#d6b990;font-size:clamp(8px,1.8vw,12px);line-height:1.25;padding:2px 3px}.tc-bottom{display:flex;justify-content:space-between;gap:5px;border-top:1px solid #b6884f;padding-top:6px;font-size:clamp(9px,1.8vw,13px);font-weight:bold}.tc-date{color:#d7af7a;text-align:right;font-size:clamp(7px,1.5vw,11px)}.overlay .trading-card{width:min(90vw,400px);height:auto;aspect-ratio:5/7}.slot .trading-card{font-size:inherit}.tc-art img{pointer-events:none}@media(min-width:700px){.tc-title{font-size:18px}.tc-role{font-size:15px}.tc-lore{font-size:12px}.tc-bottom{font-size:13px}.tc-date{font-size:11px}}</style></head><body><header><small>WILLY CORP. PRESENTS</small><h1>THE WILLY-DEX</h1><p>Pirate Cove · Collector's Registry</p></header><div class="bar"><input id="search" placeholder="Search names or card numbers" aria-label="Search cards"><span id="count">1 / 100</span></div><div class="wheel" id="wheel" aria-label="Rotating card selector"><div class="stage" id="stage"></div></div><div class="controls"><button id="prev" aria-label="Previous card">‹</button><span id="selected">#001</span><button id="next" aria-label="Next card">›</button></div><p class="tip">SWIPE OR SCROLL TO ROTATE · TAP CARD TO OPEN · TAP AGAIN TO CLOSE</p><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Card detail" tabindex="-1"></div><script>

let cards=Array.from({length:100},(_,i)=>({number:String(i+1).padStart(3,'0'),name:'???',placeholder:true})),filtered=cards;
const stage=document.getElementById('stage'),wheel=document.getElementById('wheel'),overlay=document.getElementById('overlay'),search=document.getElementById('search');
const slots=[];let position=0,target=null,velocity=0,lastTime=0,raf=0,dragging=false,dragStart=0,dragLast=0,dragTime=0,travel=0,ignoreClickUntil=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const portraits=new Map();
function content(c){
if(!c.image)return '<div class="locked"><b>WILLY CORP. · #'+safe(c.number)+'</b><strong>???</strong><b>UNDISCOVERED</b></div>';
const portrait=portraits.get(c.number);
const art=portrait?'<img draggable="false" src="'+portrait+'" alt="'+safe(c.name)+' portrait">':'<span class="missing">PORTRAIT UNAVAILABLE</span>';
return '<article class="trading-card"><div class="tc-top"><span class="tc-title">'+safe(c.name)+'</span><span class="tc-number">#'+safe(c.number)+'</span></div><div class="tc-art">'+art+'</div><div class="tc-role">'+safe(c.type||'PIRATE COVE')+'</div><div class="tc-lore">'+(c.number==='001'?'Proud leader of Pirate Cove · Founder of the guild · Joined 15 April 2022':'PIRATE COVE')+'</div><div class="tc-bottom"><span>LVL '+safe(c.level??'—')+'</span><span class="tc-date">'+safe(c.date||'')+'</span></div></article>';
}
async function loadPortrait(c){
if(!c.image || !/^cards\/[a-zA-Z0-9_-]+\.svg$/.test(c.image))return;
try{
 const response=await fetch(c.image,{cache:'no-store'});if(!response.ok)throw Error(response.status);
 const svg=await response.text();
 const match=svg.match(/<image\b[^>]*\bhref="(data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+)"/i);
 if(!match)throw Error('No embedded portrait');
 portraits.set(c.number,match[1]);build();
 if(overlay.classList.contains('open')){const active=overlay.dataset.card;if(active===c.number)open(c)}
}catch(error){console.warn('Card portrait unavailable',c.number,error)}
}
function wrap(i,n){return ((i%n)+n)%n}
function deltaFor(i){const n=filtered.length;return wrap(i-position+n/2,n)-n/2}
function build(){stage.innerHTML='';slots.length=0;document.getElementById('count').textContent=cards.filter(c=>!!c.image).length+' / 100';if(!filtered.length){document.getElementById('selected').textContent='NO MATCH';return}filtered.forEach((c,i)=>{const el=document.createElement('div');el.className='slot';el.innerHTML=content(c);el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','Card '+c.number+' '+c.name);el.addEventListener('click',()=>{if(performance.now()<ignoreClickUntil)return;const d=deltaFor(i);if(Math.abs(d)<.45){stop();open(c)}else spinTo(position+d)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});stage.append(el);slots.push(el)});paint()}
function paint(){if(!filtered.length)return;const width=Math.min(wheel.clientWidth*.42,360),nearest=wrap(Math.round(position),filtered.length);document.getElementById('selected').textContent='#'+filtered[nearest].number;for(let i=0;i<slots.length;i++){const d=deltaFor(i),a=Math.abs(d),el=slots[i];if(a>5.2){el.style.display='none';continue}el.style.display='grid';const angle=Math.max(-82,Math.min(82,d*23)),rad=angle*Math.PI/180;el.style.transform='translate(-50%,-50%) translateX('+Math.sin(rad)*width+'px) translateZ('+(-a*95)+'px) rotateY('+(-angle*.86)+'deg) scale('+(1-Math.min(a,5)*.09)+')';el.style.opacity=String(Math.max(0,1-a*.18));el.style.filter='brightness('+(1-a*.13)+')';el.style.zIndex=String(100-Math.round(a*10));el.style.pointerEvents=a>3.8?'none':'auto'}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;target=null;velocity=0;lastTime=0}
function frame(now){const dt=Math.min((now-(lastTime||now))/16.667,2);lastTime=now;if(target!==null){const diff=target-position;velocity+=diff*.085*dt;velocity*=Math.pow(.72,dt);position+=velocity*dt;if(Math.abs(diff)<.002&&Math.abs(velocity)<.002){position=target;velocity=0;target=null}}else{position+=velocity*dt;velocity*=Math.pow(.947,dt);if(Math.abs(velocity)<.012){target=Math.round(position);velocity=0}}paint();if(target!==null||Math.abs(velocity)>.001)raf=requestAnimationFrame(frame);else{raf=0;lastTime=0}}
function run(){if(!raf){lastTime=0;raf=requestAnimationFrame(frame)}}
function spinTo(p){if(!filtered.length)return;if(reduced.matches){stop();position=Math.round(p);paint();return}target=p;run()}
function step(n){if(!filtered.length)return;spinTo(Math.round(target??position)+n)}
function open(c){overlay.dataset.card=c.number;overlay.innerHTML=content(c)+'<small>TAP TO CLOSE</small>';overlay.classList.add('open');overlay.focus()}
function close(){overlay.classList.remove('open')}
overlay.onclick=close;
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
wheel.addEventListener('wheel',e=>{e.preventDefault();if(overlay.classList.contains('open')||!filtered.length)return;target=null;position+=Math.max(-2.5,Math.min(2.5,(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*.004));velocity=Math.max(-.45,Math.min(.45,velocity+(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*.0002));paint();run()},{passive:false});
wheel.addEventListener('pointerdown',e=>{if(e.button!==0||!filtered.length)return;stop();dragging=true;dragStart=dragLast=e.clientX;dragTime=performance.now();travel=0;wheel.setPointerCapture(e.pointerId)});
wheel.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=e.clientX-dragLast,dt=Math.max(1,now-dragTime),amount=-dx/Math.max(75,wheel.clientWidth*.20);position+=amount;const instant=amount/(dt/16.667);velocity=velocity*.55+instant*.45;travel+=Math.abs(dx);dragLast=e.clientX;dragTime=now;paint()});
function release(){if(!dragging)return;dragging=false;ignoreClickUntil=travel>7?performance.now()+250:0;if(reduced.matches){position=Math.round(position);velocity=0;paint();return}if(performance.now()-dragTime>100)velocity=0;velocity=Math.max(-.65,Math.min(.65,velocity*1.2));run()}
wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);wheel.addEventListener('lostpointercapture',release);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(overlay.classList.contains('open')||document.activeElement===search)return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1)}});
search.oninput=()=>{stop();const q=search.value.trim().toLowerCase();filtered=cards.filter(c=>(c.number+' '+c.name+' '+(c.type||'')).toLowerCase().includes(q));position=0;build()};
fetch('cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{cards=data;filtered=cards;position=0;build();cards.filter(c=>c.image).forEach(loadPortrait)}).catch(()=>build());
window.addEventListener('resize',paint);build();
</script></body></html>
