<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08140c">
<title>Scurvy Pete // Willy Corp. Terminal</title>
<link rel="stylesheet" href="app-shell.css?v=3">
<style>
:root{--phosphor:#a7e5a5;--phosphor-bright:#d6ffd0;--phosphor-dim:#73ac78;--phosphor-dark:#355a3f;--screen:#06150b;--amber:#f0c07d;color-scheme:dark}
*{box-sizing:border-box}
body.pete-terminal{margin:0;background:#0a0b08!important;color:var(--phosphor);font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--phosphor-bright);outline-offset:2px}
main{max-width:1160px;margin:auto;padding:24px clamp(8px,2vw,26px) 36px}
.terminal-case{position:relative;padding:clamp(9px,1.7vw,21px);border-radius:clamp(22px,4vw,40px);border:2px solid #353c30;background:linear-gradient(145deg,#3b4135 0%,#242a23 9%,#111713 55%,#383d32 100%);box-shadow:0 26px 65px #000b,inset 0 2px 1px #7d80664a,inset 0 -5px 9px #0008}
.terminal-case:after{content:"";pointer-events:none;position:absolute;inset:4px;border:1px solid #7a84652b;border-radius:inherit}
.screen{position:relative;isolation:isolate;overflow:hidden;min-height:min(76dvh,770px);border:2px solid #273b2c;border-radius:clamp(32px,6vw,70px) / clamp(22px,4vw,47px);background:radial-gradient(ellipse 115% 95% at 50% 45%,#0c2614 0%,#07190d 58%,#020a04 96%);box-shadow:inset 0 0 0 5px #0009,inset 0 0 54px #000,inset 0 0 125px #000c,0 0 12px #8dda7f16,0 0 3px #c0eebd26}
.screen:before{content:"";pointer-events:none;position:absolute;z-index:8;inset:0;border-radius:inherit;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,#0005 3px,#0002 4px);opacity:.35}
.screen:after{content:"";pointer-events:none;position:absolute;z-index:8;inset:0;border-radius:inherit;background:radial-gradient(ellipse 83% 80% at 50% 47%,transparent 45%,#0009 100%),linear-gradient(100deg,transparent 0%,#d4ffdf08 47%,transparent 56%);mix-blend-mode:screen}
.screen-body{position:relative;z-index:2;display:flex;flex-direction:column;min-height:min(76dvh,770px);padding:clamp(20px,4.5vw,52px) clamp(17px,5vw,60px) clamp(22px,3.5vw,38px);text-shadow:0 0 10px #7fe38435;filter:contrast(1.04)}
.terminal-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:15px;border-bottom:1px solid #42694891}
.brand{min-width:0;flex:1}
.brand-line{display:flex;align-items:center;min-height:clamp(41px,7vw,66px)}
.brand h1{font-size:clamp(26px,5.8vw,54px);line-height:1.1;letter-spacing:.055em;color:var(--phosphor-bright);font-weight:800;margin:0;text-shadow:0 0 20px #69da70a1,0 0 3px #d6ffd0}
.brand-sub{margin:9px 0 0;color:var(--phosphor-dim);font-size:clamp(10px,1.7vw,12px);letter-spacing:.17em}
.brand-sub[hidden]{display:none!important}
.block-cursor{display:inline-block;width:.63em;height:1em;background:currentColor;vertical-align:-.14em;margin-left:3px;animation:blink-block 1s steps(1,end) infinite;box-shadow:0 0 11px #baf5ac80}
.logo-cursor{height:.81em;width:.48em;vertical-align:-.06em}
.logo-cursor[hidden],.block-cursor[hidden]{display:none!important}
@keyframes blink-block{0%,49%{opacity:1}50%,100%{opacity:0}}
.skull-rig{width:clamp(65px,11vw,105px);height:clamp(75px,12vw,120px);flex:none;display:grid;place-items:center;filter:drop-shadow(0 0 12px #6cda7d6b);transform:rotate(-3deg)}
.skull-rig svg{display:block;width:100%;height:100%}
.skull-head{fill:#8fc59a;stroke:#c4f9be;stroke-width:2;stroke-linejoin:round}
/* Always keep the eye sockets dark. Two bright inner lenses provide actual
   contrast instead of washing the entire eye socket into the skull color. */
.skull-eye,.skull-nose{fill:#03150a}
.eye-halo{fill:#347746;opacity:.42;transition:fill .15s,opacity .15s}
.eye-core{fill:#8ed39b;stroke:#143821;stroke-width:.8;opacity:.9;transition:fill .15s,filter .15s}
.eye-glint{fill:#e4ffe3;opacity:.6}
.skull-rig.thinking .eye-halo{fill:#3dfa76;opacity:.82}
.skull-rig.thinking .eye-core{fill:#d1ffdb;opacity:1;filter:drop-shadow(0 0 3px #99ffac) drop-shadow(0 0 7px #40ff75)}
.skull-rig.thinking .eye-glint{fill:#fff;opacity:1}
.skull-rig.speaking .eye-halo{fill:#4dff8c;opacity:1;filter:drop-shadow(0 0 4px #47ff76)}
.skull-rig.speaking .eye-core{fill:#f5fff2;opacity:1;stroke:#a4ffb1;filter:drop-shadow(0 0 4px #f1fff1) drop-shadow(0 0 10px #4eff82);animation:pete-eye-talk .55s ease-in-out infinite alternate}
.skull-rig.speaking .eye-glint{fill:#fff;opacity:1}
@keyframes pete-eye-talk{from{filter:drop-shadow(0 0 3px #d6ffd9) drop-shadow(0 0 7px #45ff82)}to{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #42ff7f)}}
.skull-teeth{stroke:#123820;stroke-width:2;stroke-linecap:round}
.skull-jaw{transform-origin:50% 63%;transform-box:view-box}
.skull-rig.speaking .skull-jaw{animation:jaw-talk .22s steps(2,end) infinite}
.skull-rig.speaking{filter:drop-shadow(0 0 16px #95fda2b4)}
@keyframes jaw-talk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(6px) rotate(5deg)}50%{transform:translateY(3px) rotate(-2deg)}75%{transform:translateY(8px) rotate(3deg)}}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11px}
.terminal-button{border:1px solid #507551;background:#102519;color:var(--phosphor);border-radius:2px;min-height:31px;padding:4px 11px;font-size:11px;letter-spacing:.04em}
.terminal-button:hover{background:#234530;color:var(--phosphor-bright)}
.terminal-button:disabled{opacity:.45;cursor:default}
.terminal-button[hidden]{display:none!important}
.gate{margin:clamp(24px,6vw,72px) 0 auto;max-width:720px}
.gate[hidden]{display:none!important}
.gate-title{font-size:clamp(15px,2.5vw,20px);letter-spacing:.015em;color:var(--phosphor-bright);font-weight:700;margin:0 0 14px}
.gate-line{display:flex;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid #56855c;margin-top:5px;padding-bottom:9px}
.gate-line label{font-weight:700;color:var(--phosphor-dim);font-size:13px}
.gate-input{position:relative;display:flex;align-items:center;flex:1;min-width:170px;max-width:420px}
.gate-input input{width:100%;padding:7px 17px 7px 0;background:transparent;color:var(--phosphor-bright);border:0;outline:none;border-radius:0;caret-color:var(--phosphor-bright);letter-spacing:.1em;font-size:16px}
.gate-input input:focus-visible{outline:none}
.gate-input input::placeholder{color:#56765b}
.gate-line button{background:var(--phosphor);color:#07140c;border:0;padding:9px 14px;font-weight:900;min-height:37px}
.gate-line button:hover{background:var(--phosphor-bright)}
.gate-key-cursor{position:absolute;left:0;pointer-events:none;font-size:22px;line-height:1}
.gate-input input:not(:placeholder-shown) + .gate-key-cursor,.gate-input input:focus + .gate-key-cursor{display:none}
.chat{display:flex;flex:1;flex-direction:column;min-height:0;padding-top:12px}
.chat[hidden]{display:none!important}
.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:230px;max-height:calc(76dvh - 315px);padding:13px 2px 16px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin;scrollbar-color:#426344 transparent}
.empty{margin:auto 0;color:var(--phosphor-dim);font-size:13px;letter-spacing:.04em}
.message{max-width:100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.by{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--phosphor-dim)}
.message.user .by{color:var(--amber)}
.bubble{color:var(--phosphor-bright);font-size:clamp(12px,1.7vw,14px);line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.message.user .bubble{color:#dfc4a4}
.message.typing .bubble{color:var(--phosphor-bright)}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.sources a{font-size:11px;color:var(--phosphor-dim);text-decoration:none;border-bottom:1px solid #5d8b66}
.sources a:hover{color:var(--phosphor-bright)}
.composer{display:flex;gap:11px;align-items:flex-end;border-top:1px solid #42694891;padding-top:13px}
.prompt-marker{flex:none;font-size:22px;color:var(--phosphor-bright);line-height:44px}
.composer-entry{position:relative;flex:1;min-width:0;display:flex;align-items:stretch}
.composer textarea{width:100%;min-width:0;max-height:180px;min-height:44px;background:transparent;border:none;outline:none;color:var(--phosphor-bright);padding:11px 0;resize:vertical;caret-color:var(--phosphor);font-size:16px;line-height:1.6;tab-size:8}
.composer textarea::placeholder{color:#729a71}
.composer textarea:focus::placeholder{color:transparent}
.composer textarea:focus-visible{outline:none}
.composer-entry.custom-caret textarea{caret-color:transparent}
.caret-mirror{position:absolute;top:0;left:0;width:100%;padding:11px 0;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;visibility:hidden;pointer-events:none;box-sizing:border-box;font-size:16px;line-height:1.6;tab-size:8}
.caret-marker{display:inline-block;width:0;height:1em;vertical-align:-.1em;pointer-events:none}
.input-caret{position:absolute;z-index:3;left:0;top:0;width:.64em;height:1.45em;background:var(--phosphor-bright);box-shadow:0 0 9px #a7e5a575;pointer-events:none;animation:blink-block 1s steps(1,end) infinite}
.input-caret[hidden]{display:none!important}
.composer button{min-height:38px;background:var(--phosphor);border:0;border-radius:2px;color:#07180a;font-weight:900;padding:8px 14px}
.composer button:disabled{opacity:.5;cursor:default}
.status-line{display:flex;gap:12px;justify-content:flex-end;align-items:center;font-size:11px;color:var(--phosphor-dim);padding-top:8px}
.status-line:has(#notice:empty):has(#skip[hidden]){display:none}
#notice{flex:1;min-width:0}
#notice.error{color:#f5b783}
#skip[hidden]{display:none!important}
@media(max-width:640px){
main{padding:9px 5px 20px}
.terminal-case{padding:6px;border-radius:22px}
.screen{border-radius:34px / 25px;min-height:calc(100svh - 180px)}
.screen-body{padding:26px 18px 20px;min-height:calc(100svh - 180px)}
.skull-rig{width:64px;height:75px}
.brand-line{min-height:37px}
.brand h1{font-size:clamp(21px,6vw,29px)}
.brand-sub{font-size:9px;letter-spacing:.05em}
.messages{max-height:calc(100svh - 410px);min-height:32svh}
.gate{margin-top:36px}
.gate-title{font-size:15px}
.gate-line{gap:7px}
.gate-line button{width:100%}
}
@media(prefers-reduced-motion:reduce){
.skull-rig.speaking .skull-jaw{animation:none}
.block-cursor,.input-caret,.skull-rig.speaking .eye-core{animation:none;opacity:1}
}
</style>
<script src="app-shell.js?v=3" defer></script>
<script src="scurvy-pete.js?v=11" defer></script>
</head>
<body class="pete-terminal">
<div id="wc-app-mount"></div>
<main>
<div class="terminal-case">
<section class="screen" aria-label="Willy Corp. terminal">
<div class="screen-body">
<header class="terminal-header">
<div class="brand">
<div class="brand-line"><h1><span id="wc-logo-type" aria-label="Willy Corp."> </span><span id="wc-logo-cursor" class="block-cursor logo-cursor" aria-hidden="true"></span></h1></div>
<div id="brand-sub" class="brand-sub" hidden>SCURVY PETE // WILLY DEX INTELLIGENCE TERMINAL</div>
</div>
<div id="skull" class="skull-rig" role="img" aria-label="Scurvy Pete skull, jaw animated when speaking">
<svg viewBox="0 0 100 120" aria-hidden="true" focusable="false">
<path class="skull-head" d="M50 10 C25 10 12 27 12 48 C12 64 19 72 28 77 L29 86 L40 89 L60 89 L71 86 L72 77 C81 72 88 64 88 48 C88 27 75 10 50 10Z"/>
<path class="skull-eye" d="M26 49 C27 39 35 36 42 42 L45 54 L38 60 L30 58Z"/>
<path class="skull-eye" d="M74 49 C73 39 65 36 58 42 L55 54 L62 60 L70 58Z"/>
<g class="eye-lights" aria-hidden="true">
  <ellipse class="eye-halo" cx="35.7" cy="51" rx="7.8" ry="8.2"/>
  <ellipse class="eye-halo" cx="64.3" cy="51" rx="7.8" ry="8.2"/>
  <ellipse class="eye-core" cx="35.7" cy="51.5" rx="5.6" ry="6.5"/>
  <ellipse class="eye-core" cx="64.3" cy="51.5" rx="5.6" ry="6.5"/>
  <ellipse class="eye-glint" cx="34.1" cy="48.7" rx="1.7" ry="2.1"/>
  <ellipse class="eye-glint" cx="62.7" cy="48.7" rx="1.7" ry="2.1"/>
</g>
<path class="skull-nose" d="M50 57 L43 70 L48 74 L50 70 L52 74 L57 70Z"/>
<path d="M32 77 Q50 83 68 77 L68 85 Q50 90 32 85Z" fill="#d7f6cb"/>
<path class="skull-teeth" d="M41 79 L41 87 M50 80 L50 88 M59 79 L59 87"/>
<g class="skull-jaw">
<path class="skull-head" d="M27 86 L31 98 Q50 114 69 98 L73 86 L67 91 L33 91Z"/>
<path fill="#071e0d" d="M34 90 Q50 95 66 90 L65 97 Q50 102 35 97Z"/>
<path class="skull-teeth" d="M40 91 L40 100 M48 93 L48 102 M56 93 L56 102 M63 91 L63 100"/>
</g>
</svg>
</div>
</header>
<div class="toolbar">
<button type="button" class="terminal-button" id="access-button">ACCESS</button>
<button type="button" class="terminal-button" id="clear-button">CLEAR</button>
<button type="button" class="terminal-button" id="voice-button" aria-pressed="true" title="Toggle Pete's synthesized NPC mumble">VOICE ON</button>
</div>
<form id="access-form" class="gate" hidden>
<p class="gate-title">ENTER Pete key to access Willy Corp. Terminal</p>
<div class="gate-line">
<label for="access-code">KEY &gt;</label>
<div class="gate-input"><input id="access-code" type="password" autocomplete="off" placeholder=" " minlength="12" maxlength="256" required><span class="gate-key-cursor block-cursor" aria-hidden="true"></span></div>
<button type="submit">ENTER</button>
</div>
</form>
<section class="chat" id="chat" aria-label="Scurvy Pete conversation" hidden>
<div class="messages" id="messages" role="log" aria-live="off"><div id="empty" class="empty">ASK PETE ABOUT THE COVE</div></div>
<form class="composer" id="composer">
<span class="prompt-marker" aria-hidden="true">&gt;</span>
<div class="composer-entry" id="composer-entry"><textarea id="question" aria-label="Ask Scurvy Pete" placeholder="Ask Pete about the Cove..." rows="2" maxlength="1200" required></textarea><div id="caret-mirror" class="caret-mirror" aria-hidden="true"></div><span id="input-caret" class="input-caret" aria-hidden="true" hidden></span></div>
<button type="submit" id="send">SEND</button>
</form>
</section>
<div class="status-line"><div id="notice" role="status" aria-live="polite"></div><button type="button" id="skip" class="terminal-button" hidden>SKIP</button></div>
</div>
</section>
</div>
</main>
</body>
</html>
