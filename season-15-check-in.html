function drawRace(seg,q){
 // One permanent leaderboard layout for every recorded capture. No scene cuts.
 const step=seg.step,elapsed=q*seg.dur;
 const idx=Math.min(snapshots.length-1,Math.floor(elapsed/step));
 const within=elapsed-idx*step;
 const previous=snapshots[Math.max(0,idx-1)],current=snapshots[idx];
 const previousByName=new Map(previous.guilds.map(g=>[g.name,g]));
 const currentByName=new Map(current.guilds.map(g=>[g.name,g]));

 // XP bar motion is intentionally unchanged from the approved cut.
 const transition=firstCapture?1:ease((within-.18)/1.20);
 // Rank exchanges are separate, sequential, continuous animations.
 // Group overlapping rank paths; for this archive, #4/#5 and #8/#9
 // swap one AFTER the other, so viewers can follow the guild names.
 const shifting=current.guilds.slice(0,10).filter(g=>{
   const old=previousByName.get(g.name);
   return !firstCapture && old && old.rank!==g.rank;
 });
 const spans=shifting.map(g=>({
   low:Math.min(g.rank,previousByName.get(g.name).rank),
   high:Math.max(g.rank,previousByName.get(g.name).rank)
 })).sort((a,b)=>a.low-b.low);
 const groups=[];
 for(const span of spans){
   const last=groups[groups.length-1];
   if(last&&span.low<=last.high){last.high=Math.max(last.high,span.high)}
   else groups.push({...span});
 }

 const groupGap=groups.length>1?(available-groups.length*groupDur)/(groups.length-1):0;
 const rankMotion=g=>{
   if(!g.shifting)return transition;
   const pos=groups.findIndex(v=>Math.min(g.newRank,g.oldRank)>=v.low&&Math.max(g.newRank,g.oldRank)<=v.high);
   const start=pad+Math.max(0,pos)*(groupDur+groupGap);
   return smooth((within-start)/Math.max(.1,groupDur));
 };
 const maxXp=Math.max(...snapshots.map(s=>s.guilds[0].experience));
 const yTop=545,spacing=82;
 title('50 GUILDS   /   '+snapshots.length+' VERIFIED CAPTURES','GLOBAL','TOP TEN','SEASON 15 · XP TRACKER · CAPTURE '+(idx+1)+' / '+snapshots.length);
 dateRibbon(previous,current,firstCapture?'baseline':'compare');
 // Background rank slots never move, only the guilds occupying them.
 for(let i=0;i<10;i++){
   const y=yTop+i*spacing;
   rect(LEFT,y,714,76,i%2?'#281f1a':'#30241b',7);
   rect(LEFT+3,y+5,53,65,'#3d2d20',5);
   type(String(i+1).padStart(2,'0'),LEFT+11,y+43,31,GOLD,900);
 }
 const names=new Set([...previous.guilds.slice(0,10).map(g=>g.name),...current.guilds.slice(0,10).map(g=>g.name)]);
 const group=[...names].map(name=>{
   const old=previousByName.get(name)||null,now=currentByName.get(name)||null;
   const oldRank=old?old.rank:11,newRank=now?now.rank:11;
   const shifting=!firstCapture&&oldRank!==newRank;
   return {name,old,now,oldRank,newRank,shifting};
 }).filter(g=>g.oldRank<=10||g.newRank<=10);
 // Render steady guilds before moving guilds. Moving ranks keep their names
 // continuously visible while passing in smoothly diverging side lanes.

 for(const g of group){
   const from=g.oldRank-1,to=g.newRank-1;
   const motion=firstCapture?1:rankMotion(g);
   const y=yTop+(from+(to-from)*motion)*spacing;
   if(y<yTop-90||y>yTop+spacing*10+40)continue;
   const before=g.old||g.now,after=g.now||g.old;
   const beforeXp=before.experience,afterXp=after.experience;
   // Bars are a visual transition only; displayed XP numbers use exact captured endpoints.
   const pct=(beforeXp+(afterXp-beforeXp)*motion)/maxXp;
   const selectedXp=firstCapture?afterXp:(transition<.72?beforeXp:afterXp);
   const active=g.newRank===1||g.oldRank===1;
   // One uninterrupted geometric path. Sinusoidal lane separation is zero

   // No hard branch at 3.5%/96.5%, which caused the old horizontal jump.

     const x0=LEFT+69, full=627, shrink=319*lane;
     const w=full-shrink;

     const baseY=y;

       rect(x-6,baseY-2,w+12,78,'#51391f',9);
       rect(x-6,baseY-2,6,78,g.newRank<g.oldRank?GREEN:RED,3);
     }
     // The identity/name and XP bar stay attached to the SAME moving guild.
     const nameMax=Math.min(440,w-18);
     type(g.name.toUpperCase(),x+8*lane,baseY+28,27-2*lane,CREAM,800,'left',nameMax);
     // Keep exact endpoint totals, never synthetic intermediate XP values.
     const flip=clip((transition-.28)/.44,0,1);
     const xp=firstCapture?afterXp:(flip>=.5?afterXp:beforeXp);
     type(fmt(xp),x+w-9,baseY+28+23*lane,25-2*lane,lane>.4?GOLD:CREAM,850,'right',Math.max(125,190-35*lane));
     if(lane>.06){

       type('#'+g.oldRank+' → #'+g.newRank,x+10,baseY+53,21,GREEN,850);
       ctx.restore();
     }
     // Preserve the original XP bar interpolation, including its scale.
     const barY=baseY+43+17*lane,barH=13-3*lane;
     rect(x,barY,w,barH,'#493729',6);
     rect(x,barY,w*pct,barH,active?GOLD:'#a3805e',6);
   }else if((firstCapture&&g.newRank<=10)||(!firstCapture&&g.newRank<=10)){
     const x=LEFT+69;
     if(!firstCapture&&Math.abs(afterXp-beforeXp)>0&&motion>.02&&motion<.98){
       rect(x-5,y+1,638,73,'#58412740',7);
     }

     }else{

 }

      LEFT,1419,24,updating?GOLD:MUTED,760,'left',705);

 rect(LEFT,1445,714,4,'#3c2c1e',2);

}

  type(x.s.date.slice(5),x0+col/2,1290,26,MUTED,750,'center');
  const tt=x.s.capturedAt?new Date(x.s.capturedAt).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}):'?';
  type(tt,x0+col/2,1330,21,MUTED,650,'center');
 });
 type('RANK #'+final.rank+'  /  '+fmt(final.experience)+' XP',LEFT,1424,30,GOLD,850);
}
function drawEnd(q){
 title('RECORDED · NEVER FABRICATED','EVERY XP','COUNTS.','SEASON 15 · WILLY DEX / INTELLIGENCE');
 dateRibbon(latest,latest,'single');
 const v=latest.guilds[0];
 type('#1 '+v.name.toUpperCase(),LEFT,680,48,GOLD,900,'left',714);
 type(fmt(v.experience)+' XP',LEFT,742,44,CREAM,850);
 line(LEFT,807,RIGHT,807,'#8c673e',3);
 const c=latest.guilds.find(g=>g.name==='The Pirate Cove');
 if(c){type('#'+c.rank+'  THE PIRATE COVE',LEFT,912,39,CREAM,900,'left',700);type(fmt(c.experience)+' XP',LEFT,965,38,GREEN,800)}
 type('SOURCE: WILLY DEX GLB ARCHIVE',LEFT,1335,26,GOLD,850);
}
function drawSafe(){
 ctx.fillStyle='#ea5f5e35';ctx.fillRect(814,0,266,H);ctx.fillRect(0,1550,1080,370);
 ctx.strokeStyle='#ff8175';ctx.setLineDash([20,13]);ctx.lineWidth=4;ctx.strokeRect(LEFT,204,RIGHT-LEFT,1262);ctx.setLineDash([]);
 type('SHORTS ACTION RAIL',850,410,28,'#fff',900,'left',200);
 type('CAPTIONS / PROFILE',LEFT,1670,29,'#fff',800);
}
function paint(){
 ctx.clearRect(0,0,W,H);base(t);
 if(!ready){title('DATA CONNECTION',warning?'UNAVAILABLE':'LOADING','GLB DATA',warning||'Fetching recorded snapshots from Willy Dex...');return}
 let seg=segments[segments.length-1];
 for(const s of segments){if(t>=s.start&&t<s.end){seg=s;break}}
 const q=clip((t-seg.start)/seg.dur,0,1);
 switch(seg.type){
  case 'race':drawRace(seg,q);break;
  case 'growth':drawGrowth(seg,q);break;
  case 'up':case 'down':drawMovers(seg,q);break;
  case 'top25':drawTop25(seg,q);break;
  case 'tight':case 'lead':drawPair(seg,q);break;
  case 'cove':drawCove(seg,q);break;
  case 'end':drawEnd(q);break;
 }
 if(showZones)drawSafe();
}
function validate(d){
 if(!d||d.season!==15||!Array.isArray(d.snapshots)||d.snapshots.length<2)throw Error('Missing Season 15 captures');
 const all=d.snapshots.map((s,i)=>{
  if(!Array.isArray(s.guilds)||s.guilds.length<25)throw Error('Incomplete capture '+(i+1));
  const guilds=s.guilds.slice().sort((a,b)=>a.rank-b.rank);
  if(guilds.some((g,j)=>!g.name||g.rank!==j+1||!Number.isFinite(g.experience)||g.experience<0))throw Error('Invalid guild rank or XP in capture '+(i+1));
  return {...s,guilds};
 });
 for(let i=1;i<all.length;i++){const prev=all[i-1].capturedAt,next=all[i].capturedAt;if(prev&&next&&new Date(next)<new Date(prev))throw Error('Snapshots are not in time order')}
 return all;
}
function build(d){
 snapshots=validate(d);first=snapshots[0];latest=snapshots[snapshots.length-1];
 const old=new Map(first.guilds.map(x=>[x.name,x]));
 const shared=latest.guilds.filter(g=>old.has(g.name)).map(g=>({...g,from:old.get(g.name).rank,change:old.get(g.name).rank-g.rank,gain:g.experience-old.get(g.name).experience}));
 const growth=shared.slice().sort((a,b)=>b.gain-a.gain).slice(0,5);
 const ups=shared.filter(g=>g.change>0).sort((a,b)=>b.change-a.change||b.gain-a.gain);
 const downs=shared.filter(g=>g.change<0).sort((a,b)=>a.change-b.change||b.gain-a.gain);
 const top=latest.guilds.slice(0,25);
 const gaps=top.slice(0,24).map((g,i)=>({a:g,b:top[i+1],gap:g.experience-top[i+1].experience}));
 if(gaps.some(g=>g.gap<0))throw Error('Invalid latest Top 25 XP ordering');
 const closest=gaps.slice().sort((a,b)=>a.gap-b.gap).slice(0,4);
 const widest=gaps.slice().sort((a,b)=>b.gap-a.gap).slice(0,4);
 segments=[];duration=0;
 function add(s,dur){s.dur=dur;s.start=duration;duration+=dur;s.end=duration;segments.push(s)}
 add({type:'race',step:3.2},snapshots.length*3.2);
 add({type:'growth',items:growth},6);
 add({type:'up',items:ups},6);
 add({type:'down',items:downs},6);
 for(let i=0;i<3;i++)add({type:'top25',page:i},1.9);
 closest.forEach((pair,index)=>add({type:'tight',pair,index,total:closest.length},3.2));
 widest.forEach((pair,index)=>add({type:'lead',pair,index,total:widest.length},3.2));
 add({type:'cove'},7.2);
 add({type:'end'},5.2);
 ready=true;t=0;
 seek.disabled=false;play.disabled=false;seek.max=duration.toFixed(2);
 status.textContent='Loaded '+snapshots.length+' verified captures · uninterrupted Top 10 · '+Math.ceil(duration)+' seconds · no interpolated XP figures';
 updateUI();paint();
}
function updateUI(){
 seek.value=String(t);time.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / '+Math.floor(duration/60)+':'+String(Math.floor(duration%60)).padStart(2,'0');play.textContent=playing?'Ⅱ':'▶';
 overlay.classList.toggle('hidden',playing||t>0);
}
function makeAudio(){
 if(audio)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 audio=new AC();master=audio.createGain();master.gain.value=mute?0:.18;master.connect(audio.destination);
}
function tone(freq,t0,dur,vol,kind='sine'){
 if(!audio)return;
 const osc=audio.createOscillator(),env=audio.createGain();
 osc.type=kind;osc.frequency.setValueAtTime(freq,t0);
 if(kind==='sine')osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.58),t0+dur);
 env.gain.setValueAtTime(Math.max(.0001,vol),t0);
 env.gain.exponentialRampToValueAtTime(.001,t0+dur);
 osc.connect(env);env.connect(master);osc.start(t0);osc.stop(t0+dur+.02);
}
function noise(t0,dur,vol){
 if(!audio)return;
 const len=Math.ceil(audio.sampleRate*dur),buf=audio.createBuffer(1,len,audio.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
 const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),env=audio.createGain();
 src.buffer=buf;filter.type='highpass';filter.frequency.value=1200;
 env.gain.setValueAtTime(vol,t0);env.gain.exponentialRampToValueAtTime(.001,t0+dur);
 src.connect(filter);filter.connect(env);env.connect(master);src.start(t0);src.stop(t0+dur+.01);
}
function musicBeat(b,when){
 if(b%4===0||b%4===2)tone(130,when,.27,.8);
 if(b%4===1||b%4===3)noise(when,.11,.22);
 noise(when,.045,.075);noise(when+.25,.04,.065);
 if(b%2===0)tone([55,55,65.4,49][Math.floor(b/4)%4],when+.03,.4,.13,'triangle');
}
function beginMusic(){try{makeAudio();if(!audio)return;audio.resume();nextBeat=audio.currentTime+.02;beatIndex=0;if(beatTimer)clearInterval(beatTimer);beatTimer=setInterval(()=>{if(!playing||!audio)return;while(nextBeat<audio.currentTime+.16){musicBeat(beatIndex++,nextBeat);nextBeat+=.5}},60)}catch(e){status.textContent+=' · Audio unavailable on this browser'}}
function stopMusic(){if(beatTimer){clearInterval(beatTimer);beatTimer=null}}
function tick(now){if(!playing)return;t=Math.min(duration,(now-origin)/1000);paint();updateUI();if(t>=duration){playing=false;stopMusic();updateUI();return}raf=requestAnimationFrame(tick)}
function toggle(){if(!ready)return;if(playing){playing=false;cancelAnimationFrame(raf);stopMusic();updateUI();return}if(t>=duration)t=0;playing=true;origin=performance.now()-t*1000;beginMusic();updateUI();raf=requestAnimationFrame(tick)}
play.addEventListener('click',toggle);overlay.addEventListener('click',toggle);
seek.addEventListener('input',()=>{if(!ready)return;t=+seek.value;if(playing)origin=performance.now()-t*1000;updateUI();paint()});
soundBtn.addEventListener('click',()=>{mute=!mute;soundBtn.textContent=mute?'♫ OFF':'♫ ON';if(master)master.gain.value=mute?0:.18});
zonesBtn.addEventListener('click',()=>{showZones=!showZones;zonesBtn.textContent=showZones?'HIDE':'SAFE';paint()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)toggle()});
fetch('glb.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(build).catch(err=>{warning='Data could not be verified: '+err.message;status.textContent=warning;paint()});
paint();
})();
</script></body></html>
