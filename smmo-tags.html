<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d0b">
<title>SMMO Tags | Willy Dex</title>
<style>
:root{color-scheme:dark;--bg:#100d0b;--panel:#251b15;--border:#715338;--text:#f3dfbd;--gold:#e7b97f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:100%;margin:auto;padding:10px}
.toggle{position:sticky;top:0;z-index:5;display:flex;gap:5px;width:max-content;max-width:100%;margin:0 0 9px;padding:4px;border:1px solid var(--border);border-radius:9px;background:#17110e}
.toggle button{border:0;background:transparent;color:#bca58a;border-radius:6px;min-height:41px;min-width:100px;padding:8px 14px;font-size:15px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--gold);color:#1d130c}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}
.tag{height:43px;min-width:0;padding:0 7px;background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tag:hover{background:#47301f;border-color:var(--gold)}
.tag:active,.tag.copied{background:var(--gold);color:#20130a;border-color:var(--gold)}
button:focus-visible{outline:2px solid #ffe0a9;outline-offset:2px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:500px){main{padding:6px}.tags{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:4px}.tag{height:42px;font-size:11px}.toggle{margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<script src="smmo-tags.js?v=5" defer></script>
</head>
<body>
<main>
<div class="toggle" role="group" aria-label="SMMO tag format">
<button type="button" data-format="normal" aria-label="Normal, double brackets" aria-pressed="true">[[…]]</button>
<button type="button" data-format="sprite" aria-label="Sprite-only, exclamation brackets" aria-pressed="false">[!…!]</button>
</div>
<div class="tags" id="tags"></div>
<p class="visually-hidden" role="status" id="status" aria-live="polite"></p>
</main>
</body>
</html>
