<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLB | Willy DEX</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#f5dfb7;font:14px system-ui}nav{padding:15px;display:flex;gap:24px;border-bottom:1px solid #745537}a{color:#d9ab70;text-decoration:none}main{max-width:1100px;margin:auto;padding:25px 15px}h1,h2{font-family:Georgia,serif}.panel{background:#201a16;border:1px solid #745537;padding:16px;border-radius:12px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:#2b211b;padding:14px;border-radius:8px;border:1px solid #745537}.stat strong{display:block;font-size:27px;margin-top:6px}.muted{color:#baa184}select,input{background:#17120f;border:1px solid #745537;color:#f5dfb7;border-radius:7px;padding:9px;margin:5px;max-width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:580px}td,th{padding:10px;border-bottom:1px solid #51402f;text-align:left}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.plot{width:100%;height:320px;background:#14110e;border:1px solid #745537;border-radius:8px}label{display:inline-block;margin:5px 12px 5px 0}.graph-tools,.graph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.graph-tools label{display:flex;align-items:center;gap:5px}.graph-tools input[type=checkbox]{accent-color:#d9ab70}.graph-actions button,.legend button{background:#2b211b;color:#f5dfb7;border:1px solid #745537;border-radius:7px;padding:8px 11px;cursor:pointer}.legend{display:flex;gap:6px;flex-wrap:wrap;max-height:160px;overflow:auto;margin:12px 0}.legend button{font-size:12px}.legend button[aria-pressed=false]{opacity:.45}.legend i{display:inline-block;width:9px;height:9px;border-radius:100%;margin-right:6px}.guild-picker{padding:12px;border:1px solid #745537;border-radius:9px}.guild-picker #guildList{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-height:240px;overflow:auto;gap:7px}.guild-picker label{cursor:pointer}.graph-tooltip{color:#baa184;font-size:12px;min-height:20px}.plot{touch-action:pan-y}@media(max-width:600px){.graph-tools label{width:45%;flex-grow:1}.graph-tools select{width:100%;min-width:0}.plot{height:300px}} </style></head><body><nav><strong>WILLY CORP</strong><a href="index.html">CARDS</a><a href="wars.html">WAR INTELLIGENCE</a><a href="glb.html">GLB</a><a href="pirate-careers.html">PIRATE CAREERS</a></nav><main><h1>Global Leaderboard</h1><p class="muted">Season 15 · Recorded guild experience and rankings, with no fabricated observations.</p><div class="stats" id="stats"></div><section class="panel"><h2>Historical performance</h2><div class="graph-tools"><label>View <select id="metric"><option value="experience">Total EXP</option><option value="rank">Placement</option><option value="gain">EXP gained per observation</option><option value="rate">EXP / hour (observed intervals)</option><option value="percent">EXP growth %</option><option value="rankDelta">Rank change</option></select></label><label>Guilds <select id="preset"><option value="top5">Top 5</option><option value="top10">Top 10</option><option value="top20">Top 20</option><option value="all">All tracked</option><option value="cove" selected>Pirate Cove</option><option value="custom">Custom</option></select></label><label>From <select id="from"></select></label><label>To <select id="to"></select></label><label>Scale <select id="scale"><option value="linear">Linear</option><option value="log">Logarithmic (EXP only)</option></select></label><label><input type="checkbox" id="points" checked> Data points</label></div><div id="guildPicker" class="guild-picker" hidden><input id="guildSearch" type="search" placeholder="Find guild to compare…"><div id="guildList"></div></div><div class="graph-actions"><button id="selectAll">Compare all</button><button id="selectNone">Clear selection</button><button id="exportCsv">Export data CSV</button><button id="exportSvg">Save graph SVG</button></div><div id="legend" class="legend"></div><div class="graph-tooltip" id="inspect" aria-live="polite">Select a recorded point to inspect its timestamp and value.</div><div id="chart"></div><p class="muted" id="note"></p></section><section class="panel"><h2>Standings</h2><label>Snapshot <select id="snapshot"></select></label><input id="search" placeholder="Find guild…" aria-label="Find guild"><p id="snapshotText" class="muted"></p><div class="scroll"><table><thead><tr><th>Rank</th><th>Guild</th><th class="num">Experience</th><th class="num">Observed change</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="glb-viewer.js?v=2"></script></body></html>
